# The React source lives in web/. GitHub Pages serves the repository root, which holds the built site.
# Whenever something under web/ changes, this rebuilds the site and commits the fresh build to the root,
# so an edit made anywhere (even in the GitHub web editor) goes live on its own.
name: Build site

on:
  push:
    branches: [main, ccr-768d59cd-gkzvd5]
    paths: ['web/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Commit the build if it changed
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Build already up to date."; exit 0; fi
          git commit -m "Publish build of ${GITHUB_SHA::7}"
          git push
